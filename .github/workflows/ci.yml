name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`, which does not need a database.
      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --ci

      # Existing lint errors are reported but don't fail the build yet.
      # Remove continue-on-error once `npm run lint` is clean.
      - name: Lint
        run: npx eslint "{src,test}/**/*.ts"
        continue-on-error: true
